services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://landing.zareinnovations.com}
    image: zare-website:latest
    ports:
      - "${WEB_HOST_PORT:-3555}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://landing.zareinnovations.com}
    restart: unless-stopped
